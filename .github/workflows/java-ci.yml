
name: Java CI

on:
  push:

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile all Java files
        run: |
          mkdir -p build/classes
          find . -type f -name '*.java' -not -path './.git/*' -print0 | xargs -0 -r javac -d build/classes

      - name: Compilation successful
        run: echo "Java compilation completed successfully!"
